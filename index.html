<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliance Frameworks Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #003366 0%, #004d99 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 13px;
            opacity: 0.9;
        }

        .language-toggle {
            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 5px;
        }

        .lang-btn {
            padding: 6px 12px;
            border: none;
            background: rgba(255,255,255,0.3);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 12px;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: white;
            color: #003366;
            font-weight: bold;
        }

        .content {
            padding: 30px;
        }

        .section-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: #003366;
        }

        .industries-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            align-items: start;
        }

        .industry-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
            grid-column: auto;
            min-height: 100px;
        }

        .industry-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border-color: white;
        }

        .industry-card h3 {
            font-size: 16px;
            margin-bottom: 6px;
        }

        .industry-card p {
            font-size: 11px;
            opacity: 0.9;
            line-height: 1.4;
        }

        .frameworks-expanded {
            display: none;
            grid-column: 1 / -1;
            background: #f8f9fa;
            border-radius: 8px;
            border-top: 3px solid #667eea;
            padding: 20px;
            margin-top: 5px;
        }

        .frameworks-expanded.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .frameworks-expanded h2 {
            color: #003366;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .frameworks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .framework-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .framework-card:hover {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .framework-card h3 {
            color: #003366;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .framework-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 11px;
        }

        .framework-info-item {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #eee;
        }

        .framework-info-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #333;
        }

        .value {
            color: #667eea;
            text-align: right;
            font-weight: 500;
            font-size: 10px;
        }

        .details-panel {
            display: none;
            grid-column: 1 / -1;
            background: white;
            border: 2px solid #667eea;
            border-radius: 6px;
            padding: 15px;
            margin-top: 5px;
            max-height: 400px;
            overflow-y: auto;
            animation: slideDown 0.3s ease-out;
        }

        .details-panel.active {
            display: block;
        }

        .details-panel h3 {
            color: #003366;
            margin-bottom: 10px;
            margin-top: 12px;
            font-size: 13px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 6px;
        }

        .details-panel h3:first-child {
            margin-top: 0;
        }

        .details-list {
            list-style: none;
        }

        .details-list li {
            padding: 5px 0;
            padding-left: 20px;
            position: relative;
            color: #333;
            font-size: 11px;
            line-height: 1.4;
        }

        .details-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        .fine-box {
            background: #ffe6e6;
            border-left: 4px solid #ff4444;
            padding: 10px;
            border-radius: 4px;
            margin: 8px 0;
            font-size: 11px;
        }

        .fine-box strong {
            color: #cc0000;
        }

        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .back-btn {
            background: #999;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #666;
        }

        .close-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #003366;
        }

        footer {
            background: #f8f9fa;
            padding: 15px;
            text-align: center;
            color: #666;
            font-size: 11px;
            border-top: 1px solid #ddd;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            .industries-container {
                grid-template-columns: 1fr;
            }

            .frameworks-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1 id="main-title">Compliance Frameworks</h1>
                <p id="main-subtitle">Select industry to see applicable frameworks</p>
            </div>
            <div class="language-toggle">
                <button class="lang-btn active" onclick="setLanguage('en')">English</button>
                <button class="lang-btn" onclick="setLanguage('fr')">Français</button>
            </div>
        </header>

        <div class="content">
            <h2 class="section-title" id="select-industry">Select Your Industry</h2>
            <div class="industries-container" id="industries-container"></div>

            },

                            gdpr: { name: "RGPD", fine: "20M€ ou 4%", risks: ["Données clients EU sans consentement"], controls: ["DPA avec processeurs", "Politique de confidentialité", "Gestion du consentement"] }

                            gdpr: { name: "RGPD", fine: "20M€ ou 4%", risks: ["Données sans consentement"], controls: ["Politique de confidentialité", "Consentement cookies", "Notification d'incident"] }
                        }
                    },
                    saas: {
                        name: "☁️ SaaS / Cloud",
                        description: "Plateformes Cloud, Apps",
                        frameworks: {
                            soc2: { name: "SOC 2", fine: "Contrats entreprise", risks: ["Violation client", "Indisponibilité"], controls: ["Politiques de sécurité", "MFA", "Chiffrement", "Journalisation 12+ mois"] },
                            iso27001: { name: "ISO 27001", fine: "Aucune", risks: ["Pas de politiques"], controls: ["ISMS documenté", "Évaluation risques", "Contrôle d'accès", "Audits réguliers"] }
                        }
                    },
                    government: {
                        name: "🏛️ Gouvernement",
                        description: "Agences Fédérales, Défense",
                        frameworks: {
                            fisma: { name: "FISMA", fine: "Arrêt du contrat", risks: ["Violation données classifiées"], controls: ["Contrôles NIST", "Évaluation de sécurité", "Surveillance continue"] },
                            nist: { name: "NIST", fine: "Contrats requis", risks: ["Contrôles inadéquats"], controls: ["Contrôle d'accès", "Authentification MFA", "Journalisation audit", "Évaluation sécurité"] }
                        }
                    }
                }
            }
        };

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderContent();
        }

        function renderContent() {
            const lang = data[currentLanguage];
            document.getElementById('main-title').textContent = lang.title;
            document.getElementById('main-subtitle').textContent = lang.subtitle;
            document.getElementById('select-industry').textContent = lang.selectIndustry;
            document.getElementById('footer-text').textContent = lang.footerText;
            renderIndustries();
        }

        function renderIndustries() {
            const container = document.getElementById('industries-container');
            const lang = data[currentLanguage];
            container.innerHTML = '';

            Object.keys(lang.industries).forEach(key => {
                const industry = lang.industries[key];
                const card = document.createElement('div');
                card.className = 'industry-card';
                card.innerHTML = `<h3>${industry.name}</h3><p>${industry.description}</p>`;
                card.onclick = () => selectIndustry(key);
                container.appendChild(card);
            });
        }

        function selectIndustry(key) {
            const lang = data[currentLanguage];
            const industry = lang.industries[key];
            const container = document.getElementById('industries-container');

            const expanded = document.createElement('div');
            expanded.className = 'frameworks-expanded active';
            expanded.innerHTML = `<h2>${industry.name}</h2><div class="frameworks-grid" id="frameworks-grid"></div><div class="button-row"><button class="back-btn" onclick="closeFrameworks()">← Back to Industries</button></div>`;

            container.appendChild(expanded);

            const gridDiv = container.querySelector('#frameworks-grid');
            Object.keys(industry.frameworks).forEach(fKey => {
                const fw = industry.frameworks[fKey];
                const card = document.createElement('div');
                card.className = 'framework-card';
                card.innerHTML = `
                    <h3>${fw.name}</h3>
                    <div class="framework-info">
                        <div class="framework-info-item">
                            <span class="label">${currentLanguage === 'en' ? 'Fine:' : 'Amende:'}</span>
                            <span class="value">${fw.fine}</span>
                        </div>
                        <div class="framework-info-item">
                            <span class="label">${currentLanguage === 'en' ? 'Risks:' : 'Risques:'} ${fw.risks.length}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => showDetails(key, fKey);
                gridDiv.appendChild(card);
            });

            selectedIndustry = key;
        }

        function showDetails(key, fKey) {
            const lang = data[currentLanguage];
            const fw = lang.industries[key].frameworks[fKey];
            const container = document.getElementById('industries-container');

            let details = container.querySelector('.details-panel');
            if (details) details.remove();

            details = document.createElement('div');
            details.className = 'details-panel active';
            details.innerHTML = `
                <h2>${fw.name}</h2>
                <div class="fine-box"><strong>${currentLanguage === 'en' ? 'Maximum Fine:' : 'Amende Max:'}</strong><br>${fw.fine}</div>
                <h3>${currentLanguage === 'en' ? 'Risks' : 'Risques'}</h3>
                <ul class="details-list">${fw.risks.map(r => `<li>${r}</li>`).join('')}</ul>
                <h3>${currentLanguage === 'en' ? 'Controls' : 'Contrôles'}</h3>
                <ul class="details-list">${fw.controls.map(c => `<li>${c}</li>`).join('')}</ul>
                <button class="close-btn" onclick="closeDetails()">${currentLanguage === 'en' ? 'Close Details' : 'Fermer'}</button>
            `;
            container.appendChild(details);
        }

        function closeDetails() {
            const details = document.querySelector('.details-panel');
            if (details) details.remove();
        }

        function closeFrameworks() {
            const expanded = document.querySelector('.frameworks-expanded');
            if (expanded) expanded.remove();
            const details = document.querySelector('.details-panel');
            if (details) details.remove();
            selectedIndustry = null;
        }

        renderContent();
    </script>
</body>
</html>
