<html lang="fr">
<head>

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #003366 0%, #004d99 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 28px; margin-bottom: 5px; }
        header p { font-size: 13px; opacity: 0.9; }

            display: flex;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 8px;
            border-radius: 5px;

            padding: 6px 12px;

            border-radius: 4px;
            font-size: 12px;
            transition: all 0.3s;

        .section-title {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;

            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            align-items: start;
        }

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;

        .industry-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);

        }

        .industry-card p { font-size: 10px; opacity: 0.9; line-height: 1.4; }
        .frameworks-expanded {
            display: none;
            grid-column: 1 / -1;
            background: #f8f9fa;
            border-radius: 8px;
            border-top: 3px solid #667eea;
            padding: 20px;
            margin-top: 5px;
        }
        .frameworks-expanded.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .frameworks-expanded h2 {
            color: #003366;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .frameworks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
        }
        .framework-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .framework-card:hover {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
        .framework-card h3 {
            color: #003366;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
        }
        .framework-full-name {
            color: #667eea;
            font-size: 10px;
            font-weight: 500;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }
        .framework-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 10px;
        }
        .framework-info-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }
        .label { font-weight: bold; color: #333; }
        .value { color: #667eea; text-align: right; font-weight: 500; }
        .details-panel {
            display: none;
            grid-column: 1 / -1;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            max-height: 500px;
            overflow-y: auto;
            animation: slideDown 0.3s ease-out;
        }
        .details-panel.active { display: block; }
        .details-panel h2 {
            color: #003366;
            margin-bottom: 12px;
            font-size: 16px;
        }
        .definition-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.5;
        }
        .why-matters-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 10px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.5;
        }
        .fine-box {
            background: #ffe6e6;
            border-left: 4px solid #ff4444;
            padding: 8px;
            border-radius: 4px;
            margin: 8px 0;
            font-size: 10px;
        }
        .fine-box strong { color: #cc0000; }
        .close-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-top: 8px;
            transition: all 0.3s;
        }
        .close-btn:hover { background: #003366; }
        .back-btn {
            background: #999;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .back-btn:hover { background: #666; }
        footer {
            background: #f8f9fa;
            padding: 15px;
            text-align: center;
            color: #666;
            font-size: 10px;
            border-top: 1px solid #ddd;
        }
    </style>
</head>

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderContent();
        }

        function renderContent() {
            const lang = data[currentLanguage];
            document.getElementById('main-title').textContent = lang.title;
            document.getElementById('main-subtitle').textContent = lang.subtitle;
            document.getElementById('select-industry').textContent = lang.selectIndustry;
            document.getElementById('footer-text').textContent = lang.footerText;
            if (!selectedIndustry) renderIndustries();
        }

        function renderIndustries() {
            const container = document.getElementById('industries-container');
            const lang = data[currentLanguage];
            container.innerHTML = '';
            Object.keys(lang.industries).forEach(key => {
                const ind = lang.industries[key];
                const card = `<div class="industry-card" onclick="selectIndustry('${key}')"><h3>${ind.name}</h3><p>${ind.desc}</p></div>`;
                container.innerHTML += card;
            });
            document.getElementById('frameworks-container').innerHTML = '';
            document.getElementById('back-btn').style.display = 'none';
        }

        function selectIndustry(key) {
            selectedIndustry = key;
            const lang = data[currentLanguage];
            const ind = lang.industries[key];
            let html = `<div class="frameworks-expanded active"><h2>${ind.name}</h2><div class="frameworks-grid">`;
            Object.keys(ind.frameworks).forEach(fKey => {
                const fw = ind.frameworks[fKey];
                html += `<div class="framework-card" onclick="showDetails('${key}', '${fKey}')"><h3>${fw.short}</h3><div class="framework-full-name">${fw.full}</div><div class="framework-info"><div class="framework-info-item"><span class="label">${currentLanguage === 'en' ? 'Fine:' : 'Amende:'}</span><span class="value">${fw.fine}</span></div></div></div>`;
            });
            html += `</div></div>`;
            document.getElementById('frameworks-container').innerHTML = html;
            document.getElementById('back-btn').style.display = 'block';
        }

        function showDetails(key, fKey) {
            const lang = data[currentLanguage];
            const fw = lang.industries[key].frameworks[fKey];
            let html = `<div class="details-panel active"><h2>${fw.full}</h2>`;
            html += `<div class="definition-box"><strong>${currentLanguage === 'en' ? 'What is it?' : 'C\'est quoi?'}</strong><br>${fw.def}</div>`;
            html += `<div class="why-matters-box"><strong>${currentLanguage === 'en' ? '📊 Why it matters in this industry:' : '📊 Pourquoi c\'est important:'}</strong><br>${fw.why}</div>`;
            html += `<div class="fine-box"><strong>${currentLanguage === 'en' ? 'Maximum Fine:' : 'Amende Max:'}</strong><br>${fw.fine}</div>`;
            html += `<button class="close-btn" onclick="selectIndustry('${key}')">${currentLanguage === 'en' ? 'Close' : 'Fermer'}</button></div>`;
            document.getElementById('frameworks-container').innerHTML += html;
        }

        function goBack() {
            selectedIndustry = null;
            renderIndustries();
        }

        renderContent();
    </script>
</body>
</html>
