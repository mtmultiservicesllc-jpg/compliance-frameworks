                    manufacturing: { name: "🏭 Manufacturing", desc: "Plants, Supply Chain", frameworks: { iso27001_manufacturing: { short: "ISO 27001", full: "Information Security Management System", fine: "Required for supply chain contracts", def: "ISO 27001 applies to manufacturing protecting operational technology (OT), industrial control systems, intellectual property, supply chain. Manufacturers need ISO 27001 for supply chain contracts and OT security.", why: "Manufacturing plants hold valuable intellectual property (product designs worth millions) and critical supplier/customer relationships. Breach exposing designs costs millions in competitive advantage. Supply chain disruption from cyberattacks costs billions (NotPetya ransomware: $300M+). Customers require ISO 27001.", risks: ["Product designs accessible to employees", "Manufacturing processes not protected", "OT systems vulnerable to intrusion"], controls: ["Information Security Policy documented", "Annual risk assessment", "OT/IT segregation", "Access control limiting access", "IP encryption", "MFA for manufacturing", "Audit logs of IP access", "Secure third-party access", "Annual backup testing", "OT incident response"] }, nist_manufacturing: { short: "NIST", full: "NIST Cybersecurity Framework", fine: "Required for defense contracts", def: "NIST applies to manufacturing plants serving defense contractors. Must protect defense technologies and classified information. Defense contractors must implement NIST controls.", why: "Defense contractors are national security critical - manufacturing plants produce weapons systems, military vehicles, components. Cyberattack compromising defense manufacturing threatens national security. Defense contractors must comply with NIST or lose contracts. Defense contracts = major revenue (billions annually).", risks: ["Defense IP inadequately protected", "Classified info mishandled", "Unpatched manufacturing systems"], controls: ["NIST SP 800-53 compliance", "Role-based         function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            showIndustries();
        }

        function init() {
            document.getElementById('main-title').textContent = data[currentLanguage].title;
            document.getElementById('main-subtitle').textContent = data[currentLanguage].subtitle;
            document.getElementById('select-industry').textContent = data[currentLanguage].selectIndustry;
            document.getElementById('footer-text').textContent = data[currentLanguage].footerText;
            showIndustries();
        }

        function showIndustries() {
            let html = '<div class="industries-container">';
            for (let key in data[currentLanguage].industries) {
                let ind = data[currentLanguage].industries[key];
                html += `<div class="industry-card" onclick="showFrameworks('${key}')"><h3>${ind.name}</h3><p>${ind.desc}</p></div>`;
            }
            html += '</div>';
            document.getElementById('main-area').innerHTML = html;
        }

        function showFrameworks(industryKey) {
            let ind = data[currentLanguage].industries[industryKey];
            let html = '<button class="back-btn" onclick="showIndustries()">← Back</button><h3 style="color: #003366; margin: 20px 0;">${ind.name}</h3><div class="frameworks-grid">';
            for (let fKey in ind.frameworks) {
                let fw = ind.frameworks[fKey];
                html += `<div class="framework-card" onclick="showDetails('${industryKey}', '${fKey}')"><h3>${fw.short}</h3><div class="framework-full-name">${fw.full}</div><div style="font-size: 9px;"><strong>Fine:</strong> ${fw.fine}</div></div>`;
            }
            html += '</div>';
            document.getElementById('main-area').innerHTML = html;
        }

        function showDetails(industryKey, fKey) {
            let fw = data[currentLanguage].industries[industryKey].frameworks[fKey];
            let html = '<button class="back-btn" onclick="showFrameworks(\'' + industryKey + '\')">← Back</button><div class="details-panel"><h2>${fw.full}</h2>';
            html += `<div class="definition-box"><strong>${currentLanguage === 'en' ? 'What is it?' : 'C\'est quoi?'}</strong><br>${fw.def}</div>`;
            html += `<div class="why-matters-box"><strong>📊 ${currentLanguage === 'en' ? 'Why it matters:' : 'Pourquoi c\'est important:'}</strong><br>${fw.why}</div>`;
            html += `<div class="fine-box"><strong>${currentLanguage === 'en' ? 'Maximum Fine:' : 'Amende Max:'}</strong><br>${fw.fine}</div>`;
            html += `<div class="details-section"><h3>${currentLanguage === 'en' ? 'Risks' : 'Risques'}</h3><ul class="details-list">`;
            fw.risks.forEach(r => html += `<li>${r}</li>`);
            html += `</ul></div><div class="details-section"><h3>${currentLanguage === 'en' ? 'Required Controls' : 'Contrôles Requis'}</h3><ul class="details-list">`;
            fw.controls.forEach(c => html += `<li>${c}</li>`);
            html += '</ul></div></div>';
            document.getElementById('main-area').innerHTML = html;
        }

        init();
    </script>
