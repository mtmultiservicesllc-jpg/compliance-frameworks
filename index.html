            margin-bottom: 15px;
            border-radius: 4px;

                                short: "RGPD",
                                full: "Règlement Général sur la Protection des Données",
                                fine: "20M€ ou 4%",
                                definition: "Loi UE de protection des données.",
                                whyMatters: "Les écoles avec étudiants EU (de plus en plus courant) doivent se conformer. Les violations affectent les familles.",
                                risks: ["Violation de données étudiants", "Pas de consentement"],
                                controls: ["DPA avec fournisseurs", "Avis de confidentialité", "Gestion du consentement"]
                            }
                        }
                    }
                }
            }
        };

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderContent();
        }

        function renderContent() {
            const lang = data[currentLanguage];
            document.getElementById('main-title').textContent = lang.title;
            document.getElementById('main-subtitle').textContent = lang.subtitle;
            document.getElementById('select-industry').textContent = lang.selectIndustry;
            document.getElementById('footer-text').textContent = lang.footerText;
            if (!selectedIndustry) renderIndustries();
        }

        function renderIndustries() {
            const container = document.getElementById('industries-container');
            const lang = data[currentLanguage];
            container.innerHTML = '';
            Object.keys(lang.industries).forEach(key => {
                const industry = lang.industries[key];
                const card = `<div class="industry-card" onclick="selectIndustry('${key}')"><h3>${industry.name}</h3><p>${industry.description}</p></div>`;
                container.innerHTML += card;
            });
            document.getElementById('frameworks-container').innerHTML = '';
            document.getElementById('back-btn').classList.add('hidden');
        }

        function selectIndustry(key) {
            selectedIndustry = key;
            const lang = data[currentLanguage];
            const industry = lang.industries[key];
            let html = `<div class="frameworks-expanded active"><h2>${industry.name}</h2><div class="frameworks-grid">`;
            Object.keys(industry.frameworks).forEach(fKey => {
                const fw = industry.frameworks[fKey];
                html += `<div class="framework-card" onclick="showDetails('${key}', '${fKey}')"><h3>${fw.short}</h3><div class="framework-full-name">${fw.full}</div><div class="framework-info"><div class="framework-info-item"><span class="label">${currentLanguage === 'en' ? 'Fine:' : 'Amende:'}</span><span class="value">${fw.fine}</span></div></div></div>`;
            });
            html += `</div></div>`;
            document.getElementById('frameworks-container').innerHTML = html;
            document.getElementById('back-btn').classList.remove('hidden');
        }

        function showDetails(key, fKey) {
            const lang = data[currentLanguage];
            const fw = lang.industries[key].frameworks[fKey];
            let html = `<div class="details-panel active"><h2>${fw.full}</h2>`;
            html += `<div class="definition-box"><strong>${currentLanguage === 'en' ? 'What is it?' : 'C\'est quoi?'}</strong><br>${fw.definition}</div>`;
            html += `<div class="why-matters-box"><strong>${currentLanguage === 'en' ? '📊 Why it matters in this industry:' : '📊 Pourquoi c\'est important dans ce secteur:'}</strong><br>${fw.whyMatters}</div>`;
            html += `<div class="fine-box"><strong>${currentLanguage === 'en' ? 'Maximum Fine:' : 'Amende Max:'}</strong><br>${fw.fine}</div>`;
            html += `<div class="details-section"><h3>${currentLanguage === 'en' ? 'Risks' : 'Risques'}</h3><ul class="details-list">`;
            fw.risks.forEach(r => html += `<li>${r}</li>`);
            html += `</ul></div><div class="details-section"><h3>${currentLanguage === 'en' ? 'Required Controls' : 'Contrôles Requis'}</h3><ul class="details-list">`;
            fw.controls.forEach(c => html += `<li>${c}</li>`);
            html += `</ul></div><button class="close-btn" onclick="selectIndustry('${key}')">${currentLanguage === 'en' ? 'Close Details' : 'Fermer'}</button></div>`;
            document.getElementById('frameworks-container').innerHTML += html;
        }

        function goBack() {
            selectedIndustry = null;
            renderIndustries();
        }

        renderContent();
    </script>
</body>
</html>
