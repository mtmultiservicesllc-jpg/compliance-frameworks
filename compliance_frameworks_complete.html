        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #003366 0%, #004d99 100%);
            color: white;
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .language-toggle {
            display: flex;
            gap: 10px;
            background: rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 5px;
        }

        .lang-btn {
            padding: 8px 16px;
            border: none;
            background: rgba(255,255,255,0.3);
            color: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: white;
            color: #003366;
            font-weight: bold;
        }

        .lang-btn:hover {
            background: rgba(255,255,255,0.5);
        }

        .content {
            padding: 40px;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            margin-bottom: 20px;
            color: #003366;
        }

        .industries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .industry-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .industry-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-color: white;
        }

        .industry-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .industry-card p {
            font-size: 12px;
            opacity: 0.9;
        }

        .frameworks-section {
            display: none;
            margin-top: 10px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-top: 3px solid #667eea;
        }

        .frameworks-section.active {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .frameworks-section h2 {
            color: #003366;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .frameworks-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .framework-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .framework-card:hover {
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .framework-card h3 {
            color: #003366;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .framework-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }

        .framework-info-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #eee;
        }

        .framework-info-item:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #333;
        }

        .value {
            color: #667eea;
            text-align: right;
            font-weight: 500;
        }

        .details-section {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
            animation: slideDown 0.3s ease-out;
        }

        .details-section.active {
            display: block;
        }

        .details-section h3 {
            color: #003366;
            margin-bottom: 12px;
            margin-top: 15px;
            font-size: 14px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .details-section h3:first-child {
            margin-top: 0;
        }

        .details-list {
            list-style: none;
        }

        .details-list li {
            padding: 7px 0;
            padding-left: 25px;
            position: relative;
            color: #333;
            font-size: 12px;
            line-height: 1.5;
        }

        .details-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        .fine-box {
            background: #ffe6e6;
            border-left: 4px solid #ff4444;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 13px;
        }

        .fine-box strong {
            color: #cc0000;
        }

        .close-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 12px;
            transition: all 0.3s;
        }

        .close-btn:hover {
            background: #003366;
        }

        .back-btn {
            background: #999;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .back-btn:hover {
            background: #666;
        }

        footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #ddd;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 20px;
            }

            .industries-grid {
                grid-template-columns: 1fr;
            }

            .frameworks-list {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderContent();
        }

        function renderContent() {
            const lang = data[currentLanguage];
            document.getElementById('main-title').textContent = lang.title;
            document.getElementById('main-subtitle').textContent = lang.subtitle;
            document.getElementById('select-industry').textContent = lang.selectIndustry;
            document.getElementById('back-btn').textContent = lang.backBtn;
            document.getElementById('footer-text').textContent = lang.footerText;
            if (!selectedIndustry) renderIndustries();
        }

        function renderIndustries() {
            const container = document.getElementById('industries-container');
            const lang = data[currentLanguage];
            container.innerHTML = '';
            Object.keys(lang.industries).forEach(key => {
                const industry = lang.industries[key];
                const card = `<div class="industry-card" onclick="selectIndustry('${key}')"><h3>${industry.name}</h3><p>${industry.description}</p></div>`;
                container.innerHTML += card;
            });
            document.getElementById('frameworks-container').innerHTML = '';
            document.getElementById('back-btn').classList.add('hidden');
        }

        function selectIndustry(key) {
            selectedIndustry = key;
            const lang = data[currentLanguage];
            const industry = lang.industries[key];
            let html = `<div class="frameworks-section active"><h2>${industry.name}</h2><div class="frameworks-list">`;
            Object.keys(industry.frameworks).forEach(fKey => {
                const fw = industry.frameworks[fKey];
                html += `<div class="framework-card" onclick="showDetails('${key}', '${fKey}')"><h3>${fw.name}</h3><div class="framework-info"><div class="framework-info-item"><span class="label">${currentLanguage === 'en' ? 'Fine:' : 'Amende:'}</span><span class="value">${fw.fine.substring(0, 20)}...</span></div></div></div>`;
            });
            html += `</div></div>`;
            document.getElementById('frameworks-container').innerHTML = html;
            document.getElementById('back-btn').classList.remove('hidden');
        }

        function showDetails(key, fKey) {
            const lang = data[currentLanguage];
            const fw = lang.industries[key].frameworks[fKey];
            let html = `<div class="details-section active"><h2>${fw.name}</h2><div class="fine-box"><strong>${currentLanguage === 'en' ? 'Maximum Fine:' : 'Amende Max:'}</strong><br>${fw.fine}</div>`;
            html += `<h3>${currentLanguage === 'en' ? 'Risks' : 'Risques'}</h3><ul class="details-list">`;
            fw.risks.forEach(r => html += `<li>${r}</li>`);
            html += `</ul><h3>${currentLanguage === 'en' ? 'Controls' : 'Contrôles'}</h3><ul class="details-list">`;
            fw.controls.forEach(c => html += `<li>${c}</li>`);
            html += `</ul><button class="close-btn" onclick="selectIndustry('${key}')">${currentLanguage === 'en' ? 'Close' : 'Fermer'}</button></div>`;
            document.getElementById('frameworks-container').innerHTML += html;
        }

        function goBack() {
            selectedIndustry = null;
            renderIndustries();
        }

        renderContent();
    </script>
